<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nettoyage du Cache</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #111; color: #fff; }
        .success { color: #00ffaa; font-size: 24px; font-weight: bold; margin-bottom: 20px;}
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: var(--accent-cyan, #00d2ff); border: none; border-radius: 5px; color: #fff; margin-top: 30px;}
    </style>
</head>
<body>
    <div id="status">Opération en cours...</div>

    <script>
        async function clearEverything() {
            try {
                // 1. Désenregistrer tous les Service Workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('Service Worker désenregistré');
                    }
                }

                // 2. Vider totalement le Cache Storage (PWA)
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (let name of cacheNames) {
                        await caches.delete(name);
                        console.log('Cache supprimé: ', name);
                    }
                }

                document.getElementById('status').innerHTML = '<div class="success">✅ Cache et Service Worker supprimés avec succès !</div><p>Votre navigateur est maintenant totalement propre.</p><button onclick="window.location.href=\'/\'">Retourner à l\'accueil</button>';
            } catch(e) {
                document.getElementById('status').innerHTML = '<div style="color:red">Erreur : ' + e.message + '</div>';
            }
        }

        clearEverything();
    </script>
</body>
</html>
